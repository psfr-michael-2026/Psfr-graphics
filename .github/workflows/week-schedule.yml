name: Schedule approved PSFR week
on:
  push:
    branches: [main]
    paths: ['.github/workflows/week-schedule.yml']
permissions:
  contents: write
concurrency:
  group: psfr-graphics
  cancel-in-progress: false
jobs:
  schedule:
    if: >-
      github.event.head_commit.message == 'PSFR: schedule approved week at 7am and 7pm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install video verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          git config user.name 'PSFR automation'
          git config user.email 'psfr-automation@users.noreply.github.com'
      - name: Schedule fourteen approved posts per channel and verify
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python schedule_week.py
