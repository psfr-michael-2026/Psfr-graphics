name: Delete rejected shopping post
on:
  push:
    branches: [main]
    paths: ['.github/workflows/delete-rejected-shopping.yml']
permissions:
  contents: write
concurrency:
  group: psfr-graphics
  cancel-in-progress: false
jobs:
  delete:
    if: >-
      github.event.head_commit.message == 'PSFR: delete rejected shopping post everywhere'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'PSFR automation'
          git config user.email 'psfr-automation@users.noreply.github.com'
      - name: Delete only the three rejected post records and active assets
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python delete_rejected_shopping_post.py
