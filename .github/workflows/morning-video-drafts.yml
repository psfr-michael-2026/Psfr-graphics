name: Morning video draft test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/morning-video-drafts.yml']
permissions:
  contents: write
concurrency:
  group: psfr-graphics
  cancel-in-progress: false
jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'PSFR: run authorised three-channel video draft test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'PSFR automation'
          git config user.email 'psfr-automation@users.noreply.github.com'
      - name: Create and verify drafts only
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python morning_video_drafts.py
