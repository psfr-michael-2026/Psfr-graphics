name: Check Buffer connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-buffer.yml', 'config.json']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Read connected channels (no posts created)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python psfr.py check
