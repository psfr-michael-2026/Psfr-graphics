name: PSFR upload two approved home posts once
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psfr-graphics
  cancel-in-progress: false
jobs:
  topup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Install video verification tool
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Prepare receipt commits
        run: |
          git config user.name 'PSFR automation'
          git config user.email 'psfr-automation@users.noreply.github.com'
      - name: Stage or fill exact approved items
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python approved_topup.py stage
