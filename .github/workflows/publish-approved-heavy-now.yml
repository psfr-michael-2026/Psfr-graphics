name: PSFR publish approved weights post now once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-approved-heavy-now.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: psfr-graphics
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          git config user.name 'PSFR automation'
          git config user.email 'psfr-automation@users.noreply.github.com'
      - name: Publish only the explicitly approved weights post immediately
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publish_approved_heavy_now.py
